name: Preparar proyecto Android
on:
  push:
    branches: [feature/android-local-mvvm]
    paths:
      - '.github/workflows/preparar-android.yml'
permissions:
  contents: write
jobs:
  extraer:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extraer ZIP fuente sin alterar README
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _original
          unzip -q "Proyecto_Seguros_BPO-main.zip" -d _original
          cp -a _original/Proyecto_Seguros_BPO-main/. .
          rm -rf _original
      - name: Guardar fuentes y configuración Android
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app gradle build.gradle.kts gradle.properties gradlew gradlew.bat settings.gradle.kts .gitignore
          if ! git diff --staged --quiet; then
            git commit -m "chore: extraer codigo Android del ZIP original"
            git push origin HEAD:feature/android-local-mvvm
          fi
