name: Android Kotlin QA
on:
  push:
    branches: [qa]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android-qa.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Instalar API Android
        shell: bash
        run: |
          set -e
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          command -v sdkmanager
          sdkmanager "platforms;android-37.2"
      - name: Dar permisos a Gradle
        run: chmod +x gradlew
      - name: Compilar y ejecutar pruebas unitarias y compilar pruebas Android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:createDebugUnitTestCoverageReport --no-daemon

      - name: Publicar APK de depuración
        uses: actions/upload-artifact@v4
        with:
          name: SegurosBPO-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar informe JaCoCo de líneas y ramas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-unitaria-lineas-ramas
          path: |
            app/build/reports/coverage/test/debug/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  instalar-android:
    needs: android-qa
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SegurosBPO-debug-apk
          path: apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Permitir acceso a KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Verificar APK instalable y arranque
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            set -e
            mkdir -p evidencia-apk
            adb wait-for-device
            adb install -r apk/app-debug.apk
            adb shell pm path cl.duocuc.segurosbpo.prueba | tee evidencia-apk/paquete-${{ matrix.api }}.txt
            adb shell am start -n cl.duocuc.segurosbpo.prueba/cl.duocuc.segurosbpo.MainActivity
            sleep 8
            adb shell pidof cl.duocuc.segurosbpo.prueba | tee evidencia-apk/proceso-${{ matrix.api }}.txt
            adb exec-out screencap -p > evidencia-apk/inicio-${{ matrix.api }}.png
            adb shell uiautomator dump /sdcard/ventana.xml || true
            adb pull /sdcard/ventana.xml evidencia-apk/ventana-${{ matrix.api }}.xml || true
            adb shell am force-stop cl.duocuc.segurosbpo.prueba
            adb shell am start -n cl.duocuc.segurosbpo.prueba/cl.duocuc.segurosbpo.MainActivity
            sleep 5
            adb shell pidof cl.duocuc.segurosbpo.prueba
      - name: Guardar evidencia APK Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seguros-bpo-instalacion-api-${{ matrix.api }}
          path: evidencia-apk/
          if-no-files-found: ignore
          retention-days: 14
