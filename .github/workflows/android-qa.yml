name: Android Kotlin QA
on:
  push:
    branches: [feature/android-local-mvvm]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android-qa.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
permissions:
  contents: read
jobs:
  android-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Instalar API Android
        shell: bash
        run: |
          set -e
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          command -v sdkmanager
          sdkmanager "platforms;android-37"
      - name: Dar permisos a Gradle
        run: chmod +x gradlew
      - name: Compilar y ejecutar pruebas unitarias
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
