name: Android Kotlin QA
on:
  push:
    branches: [qa]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android-qa.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/scripts/**'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Instalar API Android
        shell: bash
        run: |
          set -e
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          command -v sdkmanager
          sdkmanager "platforms;android-37.2"
      - name: Dar permisos a Gradle
        run: chmod +x gradlew
      - name: Preparar firma persistente de APK QA
        if: github.event_name == 'push' && github.ref == 'refs/heads/qa'
        shell: bash
        env:
          QA_KEYSTORE_BASE64: ${{ secrets.QA_KEYSTORE_BASE64 }}
          QA_SIGNING_STORE_PASSWORD: ${{ secrets.QA_SIGNING_STORE_PASSWORD }}
          QA_SIGNING_KEY_ALIAS: ${{ secrets.QA_SIGNING_KEY_ALIAS }}
          QA_SIGNING_KEY_PASSWORD: ${{ secrets.QA_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$QA_KEYSTORE_BASE64" && -z "$QA_SIGNING_STORE_PASSWORD" && -z "$QA_SIGNING_KEY_ALIAS" && -z "$QA_SIGNING_KEY_PASSWORD" ]]; then
            echo "Firma persistente no configurada; este APK usa la clave debug temporal." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$QA_KEYSTORE_BASE64" || -z "$QA_SIGNING_STORE_PASSWORD" || -z "$QA_SIGNING_KEY_ALIAS" || -z "$QA_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::Los cuatro secretos de firma QA deben configurarse conjuntamente."
            exit 1
          fi
          umask 077
          archivo="$RUNNER_TEMP/segurosbpo-qa.jks"
          printf '%s' "$QA_KEYSTORE_BASE64" | base64 --decode > "$archivo"
          test -s "$archivo"
          echo "QA_SIGNING_KEYSTORE=$archivo" >> "$GITHUB_ENV"
          echo "QA_SIGNING_STORE_PASSWORD=$QA_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "QA_SIGNING_KEY_ALIAS=$QA_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "QA_SIGNING_KEY_PASSWORD=$QA_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Firma QA persistente configurada desde secretos; no se publica el almacén." >> "$GITHUB_STEP_SUMMARY"
      - name: Compilar y ejecutar pruebas unitarias y compilar pruebas Android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:createDebugUnitTestCoverageReport --no-daemon

      - name: Comprobar firma pública de APK
        shell: bash
        run: |
          set -euo pipefail
          herramienta="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$herramienta"
          "$herramienta" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > firma-qa.txt
          grep -q 'Signer #1 certificate SHA-256 digest:' firma-qa.txt
          if [[ -n "${QA_SIGNING_KEYSTORE:-}" ]]; then
            echo "APK QA: certificado persistente configurado (huella pública en artifact)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "APK QA: certificado debug temporal (no garantiza actualizaciones entre runners)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar certificado público de APK
        uses: actions/upload-artifact@v4
        with:
          name: firma-publica-apk-qa
          path: firma-qa.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK de depuración
        uses: actions/upload-artifact@v4
        with:
          name: SegurosBPO-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar informe JaCoCo de líneas y ramas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-unitaria-lineas-ramas
          path: |
            app/build/reports/coverage/test/debug/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  instalar-android:
    needs: android-qa
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SegurosBPO-debug-apk
          path: apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Permitir acceso a KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Verificar APK instalable y arranque
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: bash .github/scripts/verificar-instalacion.sh ${{ matrix.api }}
      - name: Guardar evidencia APK Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seguros-bpo-instalacion-api-${{ matrix.api }}
          path: evidencia-apk/
          if-no-files-found: ignore
          retention-days: 14
