name: APK MiRegistro Profesor
on:
  push:
    branches: [qa]
    paths:
      - '.github/workflows/mi-registro-profesor-apk.yml'
      - 'MiRegistroAvatar.zip'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compilar-profesor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Preparar Android SDK
        shell: bash
        run: |
          set -e
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          sdkmanager "platforms;android-37.2"
      - name: Extraer proyecto original
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/profesor"
          unzip -q MiRegistroAvatar.zip -d "$RUNNER_TEMP/profesor"
          rm -f "$RUNNER_TEMP/profesor/MiRegistroAvatar/local.properties"
          rm -rf "$RUNNER_TEMP/profesor/MiRegistroAvatar/.gradle"
          rm -rf "$RUNNER_TEMP/profesor/MiRegistroAvatar/app/build"
          sed -i 's/version = release(37)/version = release(37) { minorApiLevel = 2 }/' "$RUNNER_TEMP/profesor/MiRegistroAvatar/app/build.gradle.kts"
          sed -i '/    buildTypes {/a\        debug { applicationIdSuffix = ".verificado" }' "$RUNNER_TEMP/profesor/MiRegistroAvatar/app/build.gradle.kts"
          chmod +x "$RUNNER_TEMP/profesor/MiRegistroAvatar/gradlew"
      - name: Compilar y ejecutar pruebas unitarias
        shell: bash
        run: |
          set -e
          cd "$RUNNER_TEMP/profesor/MiRegistroAvatar"
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon -Pandroid.injected.testOnly=false
      - name: Comprobar identificador y testOnly
        shell: bash
        run: |
          set -e
          APK="$RUNNER_TEMP/profesor/MiRegistroAvatar/app/build/outputs/apk/debug/app-debug.apk"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -E "package:|sdkVersion:|targetSdkVersion:|launchable-activity:"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/manifiesto.txt"
          if grep -E -q 'android:testOnly.*0xffffffff' "$RUNNER_TEMP/manifiesto.txt"; then exit 1; fi
          PKG=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          test "$PKG" = "cl.duocuc.miregistro.verificado"
      - uses: actions/upload-artifact@v4
        with:
          name: MiRegistroProfesor-verificado-apk
          path: ${{ runner.temp }}/profesor/MiRegistroAvatar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  instalar-en-android:
    needs: compilar-profesor
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MiRegistroProfesor-verificado-apk
          path: apk-profesor
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Permitir acceso a KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Instalar y abrir la aplicación
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            set -e
            PACKAGE="cl.duocuc.miregistro.verificado"
            mkdir -p evidencias-profesor
            adb wait-for-device
            adb shell getprop ro.build.version.release
            adb install -r apk-profesor/app-debug.apk
            adb shell pm path "$PACKAGE" | tee evidencias-profesor/paquete-${{ matrix.api }}.txt
            adb shell am start -n "$PACKAGE/cl.duocuc.miregistro.MainActivity"
            sleep 10
            adb shell pidof "$PACKAGE" | tee evidencias-profesor/proceso-${{ matrix.api }}.txt
            adb exec-out screencap -p > evidencias-profesor/inicio-${{ matrix.api }}.png
            adb shell am force-stop "$PACKAGE"
            adb shell am start -n "$PACKAGE/cl.duocuc.miregistro.MainActivity"
            sleep 6
            adb shell pidof "$PACKAGE"
            adb shell uiautomator dump /sdcard/ventana.xml || true
            adb pull /sdcard/ventana.xml evidencias-profesor/ventana-${{ matrix.api }}.xml || true
            adb logcat -d -v brief -s AndroidRuntime:E > evidencias-profesor/errores-${{ matrix.api }}.txt
      - name: Guardar evidencias de instalación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profesor-verificacion-api-${{ matrix.api }}
          path: evidencias-profesor/
          if-no-files-found: ignore
          retention-days: 14
