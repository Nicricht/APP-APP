name: Android instrumented QA
on:
  workflow_dispatch:
  pull_request:
    branches: [qa]
    paths:
      - 'app/**'
      - '.github/workflows/android-instrumented.yml'
  push:
    branches: [qa]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android-instrumented.yml'
      - '.github/workflows/android-qa.yml'
      - '.github/scripts/**'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pruebas-en-emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Preparar SDK de compilación
        shell: bash
        run: |
          set -e
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          sdkmanager "platforms;android-37.2"
      - name: Instalar imagen del emulador con reintentos
        shell: bash
        run: |
          set -e
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          for intento in 1 2 3; do
            if sdkmanager "system-images;android-35;google_apis;x86_64"; then
              exit 0
            fi
            sleep 15
          done
          exit 1
      - name: Permitir ejecutar Gradle
        run: chmod +x gradlew
      - name: Habilitar aceleración KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Integración SQLite y recorridos Compose en emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: ./gradlew :app:createDebugAndroidTestCoverageReport --no-daemon
      - name: Resumir cobertura instrumentada de líneas y ramas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          
          informes = sorted(Path('app/build/reports/coverage/androidTest').rglob('*.xml'))
          reportes = []
          for ruta in informes:
              raiz = ElementTree.parse(ruta).getroot()
              if raiz.tag == 'report':
                  reportes.append((ruta, raiz))
          if not reportes:
              raise SystemExit('No se encontró el informe XML de cobertura instrumentada')
          ruta, raiz = reportes[0]
          print(f'Informe instrumentado: {ruta}')
          for tipo in ('LINE', 'BRANCH'):
              contador = next((c for c in raiz.findall('counter') if c.get('type') == tipo), None)
              if contador is None:
                  raise SystemExit(f'Falta el contador {tipo}')
              cubiertas = int(contador.get('covered', '0'))
              perdidas = int(contador.get('missed', '0'))
              total = cubiertas + perdidas
              porcentaje = 100 * cubiertas / total if total else 100
              print(f'{tipo}: {cubiertas}/{total} ({porcentaje:.2f}%)')
          pendientes = []
          for clase in raiz.findall('.//class'):
              nombre = clase.get('name', '')
              faltantes = {c.get('type'): int(c.get('missed', '0')) for c in clase.findall('counter')}
              if faltantes.get('LINE', 0) or faltantes.get('BRANCH', 0):
                  pendientes.append((faltantes.get('LINE', 0), faltantes.get('BRANCH', 0), nombre))
          for lineas, ramas, nombre in sorted(pendientes, reverse=True)[:20]:
              print(f'Pendiente: {nombre}: {lineas} líneas, {ramas} ramas')
          PY
      - name: Recuperar clases de Compose para diagnóstico
        if: always()
        shell: bash
        run: |
          mkdir -p app/build/qa-bytecode
          for nombre in ThemeKt FormularioScreenKt ResumenGraficosCasosKt PerfilCuentaScreenKt ControlPlazos; do
            ruta=$(find app/build -path app/build/qa-bytecode -prune -o -type f -name "$nombre.class" -print -quit)
            if [ -n "$ruta" ]; then
              cp "$ruta" "app/build/qa-bytecode/$nombre.class"
            fi
          done
          find app/build/qa-bytecode -type f -printf '%f\n'

      - name: Guardar informes instrumentados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-android-instrumentado
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/coverage/androidTest/
            app/build/tmp/kotlin-classes/debug/
            app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes/
            app/build/qa-bytecode/
          if-no-files-found: ignore
          retention-days: 14
